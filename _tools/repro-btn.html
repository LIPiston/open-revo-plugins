<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>repro: button rule not applying</title>
<link rel="stylesheet" href="../_extracted/host-shell.css">
<link rel="stylesheet" href="../skin-win11-dark/theme.css">
<style>body{margin:0;font:13px sans-serif;background:#fff;color:#000} #out{font:12px ui-monospace,Consolas,monospace;white-space:pre}</style>
</head><body>
<div data-skin="skin-win11-dark" id="root">
  <div class="mini-drawer-root" data-theme="mono">
    <div class="mini-drawer-content">
      <div class="m-grid-4"><button class="m-btn-action" id="b1">a</button></div>
    </div>
  </div>
</div>
<pre id="out"></pre>
<script>
var out = [];
var b = document.getElementById('b1');
var pcs = getComputedStyle(b);
out.push('bg        = ' + pcs.background);
out.push('bgColor   = ' + pcs.backgroundColor);
out.push('color     = ' + pcs.color);
out.push('fontWeight= ' + pcs.fontWeight);
out.push('--wf-control        = ' + pcs.getPropertyValue('--wf-control'));
out.push('--wf-control-stroke = ' + pcs.getPropertyValue('--wf-control-stroke'));
out.push('--wf-radius-sm      = ' + pcs.getPropertyValue('--wf-radius-sm'));
out.push('--wf-text           = ' + pcs.getPropertyValue('--wf-text'));
out.push('--- sheet[1] rules matching #b1 ---');
var s = document.styleSheets[1];
for (var i = 0; i < s.cssRules.length; i++) {
  var r = s.cssRules[i];
  if (!r.selectorText) continue;
  if (b.matches(r.selectorText)) {
    out.push('#' + i + ' ' + r.selectorText.replace(/\[data-skin="[^"]*"\]/g, '~').slice(0, 70)
      + ' | bg=[' + r.style.getPropertyValue('background') + '] prio=' + r.style.getPropertyPriority('background')
      + ' decls=' + r.style.length);
  }
}
out.push('--- inline override test ---');
b.style.background = 'red';
out.push('after inline red : ' + getComputedStyle(b).backgroundColor);
b.style.background = '';
out.push('after remove     : ' + getComputedStyle(b).backgroundColor);
out.push('--- div with same class (no UA button styling) ---');
var d = document.createElement('div');
d.className = 'm-btn-action';
d.textContent = 'd';
document.querySelector('.m-grid-4').appendChild(d);
out.push('div.m-btn-action  : ' + getComputedStyle(d).backgroundColor + ' / ' + getComputedStyle(d).color);
out.push('--- button with author background set via new rule injected last ---');
var st = document.createElement('style');
st.textContent = '.m-btn-action{background:var(--wf-control);border:1px solid var(--wf-control-stroke);color:var(--wf-text)}';
document.head.appendChild(st);
out.push('after injected rule: ' + getComputedStyle(b).backgroundColor + ' / ' + getComputedStyle(b).color);
document.getElementById('out').textContent = out.join('\n');
</script>
</body></html>
